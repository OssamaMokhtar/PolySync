name: ProjectOS (GitHub Pages)

# Builds portal/ (one self-contained HTML file generated from product/data,
# evals/results and docs) and publishes it to
# https://ossamamokhtar.github.io/PolySync/ . Requires Settings -> Pages ->
# Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json
      - name: Product data valid and generated docs current
        run: node product/scripts/build.mjs --check
      - name: Build portal
        working-directory: portal
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist
      - id: deployment
        uses: actions/deploy-pages@v4
