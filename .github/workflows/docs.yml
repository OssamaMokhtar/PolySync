name: Docs CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links resolve
        run: |
          fail=0
          for src in $(find . -name '*.md' -not -path './.git/*'); do
            for target in $(grep -oE '\]\([^)]+\)' "$src" | sed -E 's/^\]\(//; s/\)$//'); do
              case "$target" in http*|\#*|mailto:*) continue ;; esac
              clean="${target%%#*}"
              [ -z "$clean" ] && continue
              resolved="$(dirname "$src")/$clean"
              if [ ! -e "$resolved" ]; then
                echo "::error file=$src::broken relative link -> $target"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Mermaid blocks are balanced and non-empty
        run: |
          fail=0
          for f in $(find . -name '*.md' -not -path './.git/*'); do
            opens=$(grep -c '^```mermaid' "$f" || true)
            closes=$(awk '/^```mermaid/{c=1;next} /^```$/{if(c){n++;c=0}} END{print n+0}' "$f")
            if [ "$opens" -ne "$closes" ]; then
              echo "::error file=$f::unbalanced mermaid fence ($opens opened, $closes closed)"
              fail=1
            fi
            if [ "$opens" -gt 0 ]; then
              body=$(awk '/^```mermaid/{c=1;next} /^```$/{c=0} c' "$f" | tr -d '[:space:]')
              if [ -z "$body" ]; then
                echo "::error file=$f::empty mermaid block"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Every doc declares a status
        run: |
          fail=0
          for f in docs/*.md; do
            case "$f" in docs/README.md|docs/GAPS.md) continue ;; esac
            if ! grep -qE '^> Status:' "$f"; then
              echo "::error file=$f::missing '> Status:' header (AUTHORED / PROPOSED / TBD)"
              fail=1
            fi
          done
          exit $fail

      - name: No unresolved conflict markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>|=======$)' --include='*.md' .; then
            echo "::error::merge conflict markers committed"
            exit 1
          fi
