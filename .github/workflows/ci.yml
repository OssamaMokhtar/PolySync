name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PolySync is a documentation-first repo (docs/ directory with Markdown).
# The codebase is not in this repository — this workflow validates the
# documentation structure and provides the roadmap for the code pipeline.

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation structure
        run: |
          echo "Checking required files..."
          test -f README.md && echo "✓ README.md"
          test -f LICENSE && echo "✓ LICENSE"
          test -f SECURITY.md && echo "✓ SECURITY.md"
          test -f PRIVACY.md && echo "✓ PRIVACY.md"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md"
          echo ""
          echo "Checking docs/ directory..."
          for f in docs/*.md; do
            test -f "$f" && echo "✓ $(basename $f)"
          done
          echo ""
          echo "Documentation structure validated."

      - name: Check for sensitive data
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "AIza" . --include="*.md" 2>/dev/null; then
            echo "⚠ WARNING: Potential Google API key found — review immediately"
            exit 1
          fi
          echo "✓ No obvious secrets detected."

      - name: Lint markdown
        run: |
          echo "Linting markdown files..."
          # Basic markdown lint: check for common issues
          for f in docs/*.md README.md SECURITY.md PRIVACY.md CONTRIBUTING.md; do
            if [ -f "$f" ]; then
              # Check for lines longer than 120 chars (warning only)
              if grep -nE '.{121}' "$f" > /dev/null 2>&1; then
                echo "⚠ $f: some lines exceed 120 characters"
              fi
            fi
          done
          echo "✓ Markdown lint complete."

      - name: Document roadmap
        run: |
          echo ""
          echo "=== CI Roadmap ==="
          echo "Current: Documentation structure validation + markdown lint"
          echo "Next: Add npm/TypeScript pipeline when codebase is added to this repo"
          echo "Future: npm ci, lint, build, test, npm audit"
          echo ""
          echo "See improvement plan at Obsidian/Portfolio-Due-Diligence/01-Improvement-Plan-PolySync.md"
