name: CI

# app/ holds the runtime; engine/ holds the deterministic engine (docs/ARCHITECTURE.md).
# Every step is a gate: nothing here is allowed to pass on failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  boundaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Architecture: allowed imports per area; one product per repo (ADR-012)"
        run: node scripts/check-boundaries.mjs

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Install
        run: npm ci

      - name: Engine typecheck (strict, zero errors)
        run: npm run typecheck

      - name: Unit tests (plans, hybrid rules H1-H9, bounds checker, routing)
        run: npm test

      - name: "Evals: safety layer + hybrid layer (hard gates, results reported with n)"
        run: WRITE_RESULTS=1 npm run eval

      - name: Committed eval results match this run (only the timestamp may differ)
        working-directory: .
        run: |
          if ! git diff --exit-code -I '"ranAt"' -- evals/results/; then
            echo "::error::evals/results/ is stale; run 'WRITE_RESULTS=1 npm run eval' in engine/ and commit"; exit 1
          fi

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: App typecheck ratchet (fails if type errors increase)
        run: npm run typecheck:ratchet

      - name: Unit tests (auth, input validation, rate limit, session content)
        run: npm test

      - name: Build
        run: npm run build

      - name: Client bundle carries no Gemini client or key
        run: npm run check-bundle

      - name: Production bundle boots; anonymous and x-user-id requests get 401; unknown API paths get a JSON 404
        run: npm run boot-check

      - name: Client never asserts its own identity (ID token only)
        run: |
          if grep -rni "x-user-id" src; then
            echo "::error::client code sends x-user-id; use apiFetch (Firebase ID token)"; exit 1
          fi

      - name: "No browser dialogs or invented workouts in the app (UX-01, UX-10)"
        run: |
          if grep -rnE "\balert\(|window\.prompt|\bconfirm\(" src; then
            echo "::error::use in-app status or sheets, not browser dialogs"; exit 1
          fi
          if grep -rn "EXERCISE_LIBRARY.slice" src; then
            echo "::error::never fill a session from the exercise library; the engine is the only source"; exit 1
          fi

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: No secrets in the repo
        working-directory: .
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- ':!app/firebase-applet-config.json'; then
            echo "::error::possible Google API key committed"; exit 1
          fi

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and build ProjectOS (compiles the production engine into the page)
        run: npm run build
      - name: Single self-contained file, no third-party scripts
        run: |
          test -f dist/index.html
          if grep -oE '<script[^>]+src="https?://' dist/index.html; then echo "::error::external script in portal"; exit 1; fi


  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: prototype/package-lock.json
      - name: Install
        run: npm ci
      - name: Adapter and safety-detector tests (G1–G7, engine invariants)
        run: npm test
      - name: Typecheck and build (compiles the production engine into one file)
        run: npm run build
      - name: Single self-contained file, no third-party scripts
        run: |
          test -f dist/index.html
          if grep -oE '<script[^>]+src="https?://' dist/index.html; then echo "::error::external script in prototype"; exit 1; fi
      - name: Install Chromium for the end-to-end run
        run: npx playwright install --with-deps chromium
      - name: End-to-end acceptance (flows, axe WCAG 2.2 AA, 44 px targets, overflow; dark and light)
        run: npm run e2e
