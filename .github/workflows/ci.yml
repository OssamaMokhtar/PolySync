name: CI

# app/ holds the runtime (moved here from PolyVerses on 2026-09-23).
# Every step is a gate: nothing here is allowed to pass on failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Engine typecheck (strict, zero errors)
        run: npm run typecheck:engine

      - name: App typecheck ratchet (fails if type errors increase)
        run: npm run typecheck:ratchet

      - name: Unit tests (engine, bounds checker, routing)
        run: npm test

      - name: Safety-layer evals (hard gates, results reported with n)
        run: npm run eval

      - name: Build
        run: npm run build

      - name: Client bundle carries no Gemini client or key
        run: npm run check-bundle

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: No secrets in the repo
        working-directory: .
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- ':!app/firebase-applet-config.json'; then
            echo "::error::possible Google API key committed"; exit 1
          fi
