    <polygon points="0 0, 10 3.5, 0 7" fill="#555555"/>
  </marker>
  <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#27ae60"/>
    <stop offset="100%" stop-color="#1e8449"/>
  </linearGradient>
  <linearGradient id="llmGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2980b9"/>
    <stop offset="100%" stop-color="#1a5276"/>
  </linearGradient>
</defs>

<rect width="800" height="500" fill="#fafafa"/>

<!-- Title -->
<text x="400" y="30" text-anchor="middle" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">PolySync — System Architecture</text>
<text x="400" y="48" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="11">Deterministic engine prescribes; LLM explains and proposes within bounds</text>
<line x1="20" y1="56" x2="780" y2="56" stroke="#dddddd" stroke-width="1"/>

<!-- ===== CLIENTS ===== -->
<rect x="20" y="85" width="150" height="50" rx="6" fill="#2c3e50"/>
<text x="95" y="103" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">Athlete App</text>
<text x="95" y="117" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="8">React · Vite · Express</text>

