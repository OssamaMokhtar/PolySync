<rect x="640" y="385" width="14" height="10" fill="#8e44ad"/>
<text x="658" y="394" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="9">RAG / Protocols</text>

<!-- Footer -->
<text x="400" y="420" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">The LLM never writes a load prescription. The deterministic engine does.</text>
<text x="400" y="435" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="9">Prompt injection cannot change training load. Provider outage degrades explanation, not training.</text>
<text x="400" y="452" text-anchor="middle" fill="#999999" font-family="Helvetica, Arial, sans-serif" font-size="8">PolySync · Ossama Mokhtar · github.com/OssamaMokhtar/PolySync</text>
