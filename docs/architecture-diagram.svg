<!-- Coach queue → coach console (feedback) -->
<path d="M 330 285 C 330 340, 170 340, 170 210" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
