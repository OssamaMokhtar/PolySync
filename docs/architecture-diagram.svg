<rect x="20" y="385" width="14" height="10" fill="#27ae60"/>
<text x="38" y="394" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="9">Deterministic (owns load)</text>
<rect x="170" y="385" width="14" height="10" fill="#2980b9"/>
<text x="188" y="394" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="9">AI (explains + proposes)</text>
